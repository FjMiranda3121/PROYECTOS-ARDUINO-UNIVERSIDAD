<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoRutas | Portal Operador</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans pb-10">

    <!-- HEADER MÓVIL CORPORATIVO -->
    <header class="bg-slate-900 text-white px-4 py-3.5 sticky top-0 z-30 shadow-md border-b border-slate-800">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center text-white font-black shadow-lg">
                    <i class="fa-solid fa-truck-ramp-box text-sm"></i>
                </div>
                <div>
                    <h1 class="font-black text-sm text-white tracking-wide leading-none">EcoRutas</h1>
                    <span class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Portal Operador</span>
                </div>
            </div>

            <!-- Indicador Estado API + Logout -->
            <div class="flex items-center gap-2">
                <div id="apiStatusContainer" class="flex items-center gap-1.5 bg-green-950/80 px-2.5 py-1 rounded-full border border-green-800">
                    <span class="relative flex h-2 w-2">
                      <span id="apiStatusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span id="apiStatusDot" class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <span id="apiStatusText" class="text-[10px] font-bold text-green-300">Online</span>
                </div>

                <button id="btnLogout" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-red-900/50 text-slate-300 hover:text-red-400 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- BARRA DE INFORMACIÓN DEL OPERADOR EN CAMPO -->
    <div class="bg-gradient-to-r from-emerald-800 to-teal-900 text-white p-4 shadow-md">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <p class="text-[11px] text-emerald-200 font-semibold uppercase tracking-wider">Operador en Ruta</p>
                <p class="text-sm font-black text-white" id="userNameDisplay">@operador</p>
            </div>
            <button id="btnActualizarOperador" class="bg-white/10 hover:bg-white/20 text-white p-2.5 rounded-xl backdrop-blur-sm transition-colors text-xs flex items-center gap-1.5 font-bold shadow-sm">
                <i class="fa-solid fa-arrows-rotate"></i>
                <span>Refrescar</span>
            </button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4">
        
        <div class="flex justify-between items-center px-1">
            <h2 class="text-xs font-black text-slate-700 uppercase tracking-wider">Puntos de Recolección</h2>
            <span id="cantPendientes" class="text-[11px] font-bold bg-slate-200 text-slate-700 px-2.5 py-0.5 rounded-full">-</span>
        </div>

        <!-- LISTA DINÁMICA DE TARJETAS MÓVILES -->
        <div id="contenedorRutaOperador" class="space-y-3">
            <div class="p-8 text-center text-slate-400 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <i class="fa-solid fa-spinner animate-spin text-emerald-500 text-2xl mb-2"></i>
                <p class="text-xs font-bold text-slate-600">Cargando contenedores en ruta...</p>
            </div>
        </div>

    </main>

    <!-- MODAL DE CONFIRMACIÓN (DISEÑO MÓVIL TÁCTIL) -->
    <div id="modalConfirmarRecoleccion" class="hidden fixed inset-0 bg-slate-900/70 z-[9999] flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
        <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl shadow-2xl p-6 border border-slate-200 space-y-4">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto sm:hidden mb-1"></div>
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto text-xl shadow-sm">
                    <i class="fa-solid fa-trash-can-arrow-up"></i>
                </div>
                <h3 class="font-black text-slate-800 text-base">Confirmar Recolección</h3>
                <p class="text-xs text-slate-500">¿Deseas confirmar el vaciado del contenedor <span id="modalCanecaIdText" class="font-bold text-slate-800"></span>?</p>
            </div>

            <div class="flex gap-2 pt-2">
                <button id="btnCancelarRecoleccion" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs transition-colors">
                    Cancelar
                </button>
                <button id="btnConfirmarRecoleccion" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg text-xs transition-colors flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-check"></i>
                    <span>Confirmar</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Script Operador -->
    <script src="/js/operador.js"></script>
</body>
</html>
