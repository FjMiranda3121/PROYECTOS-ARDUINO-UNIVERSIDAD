<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRutas | Portal Operativo Móvil</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans pb-6">

    <!-- BARRA SUPERIOR FIJA (ESTILO APP MÓVIL) -->
    <header class="bg-slate-900 text-white px-4 py-3 shadow-md sticky top-0 z-20 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-truck-pickup text-amber-400 text-xl"></i>
            <h1 class="font-bold text-base tracking-wide">Ruta Operativa</h1>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- INDICADOR DINÁMICO DE ESTADO API (PUNTO 7: ONLINE / OFFLINE) -->
            <div id="apiStatusContainer" class="flex items-center gap-1.5 bg-green-500/20 px-2.5 py-1 rounded-full border border-green-400/30 transition-colors">
                <span class="relative flex h-2.5 w-2.5">
                  <span id="apiStatusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span id="apiStatusDot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-400"></span>
                </span>
                <span id="apiStatusText" class="text-[10px] font-black text-green-300 uppercase tracking-wider">Online</span>
            </div>

            <!-- BOTÓN REFRESCAR -->
            <button id="btnActualizarRuta" class="p-1.5 text-slate-300 hover:text-white transition-colors" title="Actualizar Ruta">
                <i class="fa-solid fa-arrows-rotate text-base"></i>
            </button>

            <!-- BOTÓN LOGOUT -->
            <button id="btnLogoutOperador" class="p-1.5 text-red-400 hover:text-red-300 transition-colors" title="Cerrar Sesión">
                <i class="fa-solid fa-right-from-bracket text-base"></i>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL MÓVIL -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4">
        
        <!-- TARJETA INFORMATIVA DEL OPERADOR -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Operador en Turno</p>
                    <p class="font-bold text-slate-800 text-sm" id="operadorEmail">Cargando...</p>
                </div>
            </div>
            <span class="bg-amber-100 text-amber-800 text-[10px] font-black px-2.5 py-1 rounded-full border border-amber-300 uppercase tracking-wider">
                Campo
            </span>
        </div>

        <!-- ENCABEZADO DE SECCIÓN -->
        <div class="flex justify-between items-center px-1">
            <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wide">Puntos Pendientes</h2>
            <span id="cantPendientes" class="bg-slate-800 text-white text-xs font-black px-2.5 py-0.5 rounded-full shadow-sm">-</span>
        </div>

        <!-- CONTENEDOR DINÁMICO DE RUTAS PRIORIZADAS -->
        <div id="listaRutasContainer" class="space-y-3">
            <div class="text-center py-10 text-slate-400">
                <i class="fa-solid fa-spinner animate-spin text-2xl mb-2"></i>
                <p class="text-sm font-medium">Buscando puntos críticos en Render...</p>
            </div>
        </div>

    </main>

    <!-- MODAL DE CONFIRMACIÓN DE RECOLECCIÓN EN CAMPO -->
    <div id="modalConfirmarRecoleccion" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-xs border border-slate-200 text-center space-y-4">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-truck-ramp-box"></i>
            </div>
            <div>
                <h3 class="font-bold text-slate-800 text-lg">¿Confirmar Vacíado?</h3>
                <p class="text-xs text-slate-500 mt-1">
                    Estás registrando la recolección del contenedor <span id="idCanecaRecoleccionText" class="font-bold text-slate-800"></span>.
                </p>
            </div>
            <div class="flex gap-2 pt-2">
                <button id="btnCancelarRecoleccion" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-colors text-xs">
                    Cancelar
                </button>
                <button id="btnEjecutarRecoleccion" class="w-1/2 bg-slate-900 hover:bg-black text-white font-bold py-3 rounded-xl shadow-md transition-colors text-xs flex items-center justify-center gap-1">
                    <i class="fa-solid fa-check"></i> Vaciar
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA MÓVIL -->
    <script src="/Js/operador.js"></script>
</body>
</html>
