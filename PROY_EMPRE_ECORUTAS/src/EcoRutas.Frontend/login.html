<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRutas | Inicio de Sesión</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-emerald-600 via-teal-800 to-slate-900 h-screen flex items-center justify-center font-sans p-4">

    <!-- Tarjeta de Login -->
    <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20 text-center">
        
        <!-- Logo de la Empresa -->
        <div class="mb-6 flex justify-center">
            <img src="/img/LOGO_ESLOGAN_ECORUTAS.png" alt="EcoRutas Logo" class="h-20 w-auto object-contain" onerror="this.src='https://placehold.co/200x80?text=EcoRutas'">
        </div>

        <h2 class="text-2xl font-black text-slate-800 tracking-tight">Iniciar Sesión</h2>
        <p class="text-xs text-slate-500 mt-1 mb-6">Plataforma de Monitoreo Inteligente EcoRutas v3.0</p>

        <form id="formLogin" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Usuario / Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="emailInput" placeholder="admin@ecorutas.com" required 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="passwordInput" placeholder="••••••••••••" required 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                </div>
            </div>

            <button type="submit" id="btnLoginSubmit" 
                class="w-full bg-slate-900 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm mt-2">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <p id="errorLogin" class="hidden text-xs font-bold text-red-500 mt-4 bg-red-50 p-2.5 rounded-lg border border-red-200">
            Credenciales incorrectas o servidor no disponible.
        </p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
