<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRutas | Iniciar Sesión</title>
    <!-- Tailwind CSS -->
     <script src="https://cdn.tailwindcss.com"></script>
     <!-- Iconos FontAwesome -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border border-salte-200">
    <div class="text-center mb-6">
        <i class="fa-solid fa-user-circle text-5xl text-slate-700 mb-2"></i>
        <h1 class="text-xl font-bold text-slate-800">EcoRutas</h1>
    </div>

    <form id="formLogin" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Usuario / Email</label>
            <input type="email" id="email" required class="w-full px-3 py-2 border border-salte-300 rounded-lg 
                    focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1" >Contraseña</label>
            <input type="password" id="password" required class="w-full px-3 py-2 border border-salte-300 rounded-lg 
                    focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div id="errorMensaje" class="hidden text-red-500 text-sm text-center font-medium"></div>

        <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-lg transition-colors mt-4">
            Login
        </button>
    </form>
    </div>
    <script src="js/login.js"> </script>

    </body>
</html>
